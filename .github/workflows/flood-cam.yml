name: Flood cam capture

# Snapshots the Club Evexia Shoreline Hwy cam every 15 minutes around big
# high tides, to calibrate the flood window in bot.py. Captures and a CSV log
# are committed to the flood-cam branch, keeping images out of main, along
# with calibration.md (see calibrate.py). Opens an issue once the fit is good.

on:
  schedule:
    # Every 15 min, ~6am-8pm Pacific. flood_cam.py decides whether to capture.
    - cron: "*/15 13-23,0-3 * * *"
  workflow_dispatch:

permissions:
  contents: write # to push to the flood-cam branch
  issues: write # to announce when calibration is ready

concurrency:
  group: flood-cam

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a big tide
        id: check
        run: python3 flood_cam.py --check >> "$GITHUB_OUTPUT"

      - name: Check out flood-cam branch
        if: steps.check.outputs.capture == 'true'
        run: |
          if git ls-remote --exit-code --heads origin flood-cam; then
            git fetch --depth=1 origin flood-cam
            git worktree add -B flood-cam data FETCH_HEAD
          else
            git worktree add --orphan -b flood-cam data
          fi

      - name: Capture
        if: steps.check.outputs.capture == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 flood_cam.py data

      - name: Calibrate
        id: calibrate
        if: steps.check.outputs.capture == 'true'
        run: python3 calibrate.py data >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.check.outputs.capture == 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Flood cam capture $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M')"
          git push origin flood-cam

      - name: Announce calibration ready
        if: steps.calibrate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Flood calibration ready"
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json number -q 'length')
          if [ "$existing" -eq 0 ]; then
            {
              echo "Enough tides have been captured to calibrate the flood window."
              echo "Update FLOOD_LEVEL_FT and DRAIN_LAG in bot.py from the fit below,"
              echo "then disable the Flood cam capture workflow."
              echo
              echo "Report: ${{ github.server_url }}/${{ github.repository }}/blob/flood-cam/calibration.md"
              echo
              cat data/calibration.md
            } > body.md
            gh issue create --title "$title" --body-file body.md
          fi
